<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<!-- Look Up and Down: the night sky above a glowing horizon, the Earth below it -->
<defs>
<clipPath id="tile"><rect width="100" height="100" rx="20"/></clipPath>
<clipPath id="earth"><circle cx="50" cy="152" r="98"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040816"/><stop offset="1" stop-color="#14275a"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f74c9"/><stop offset="1" stop-color="#0d2b62"/></linearGradient>
</defs>
<g clip-path="url(#tile)">
<rect width="100" height="100" fill="url(#sky)"/>
<circle cx="18" cy="16" r="2.2" fill="#fff"/>
<circle cx="40" cy="30" r="1.5" fill="#cfe0ff"/>
<circle cx="30" cy="9" r="1.2" fill="#cfe0ff"/>
<circle cx="88" cy="44" r="1.4" fill="#cfe0ff"/>
<circle cx="12" cy="40" r="1.3" fill="#fff"/>
<path d="M71 13 A12 12 0 1 0 71 37 A9 12 0 1 1 71 13 Z" fill="#f1ead6"/>
<circle cx="50" cy="152" r="98" fill="url(#sea)"/>
<g clip-path="url(#earth)" fill="#5fae6a">
<path d="M6 66 C16 58 30 60 36 68 C40 76 30 84 18 82 C10 92 2 86 0 80 Z"/>
<path d="M58 60 C70 55 86 58 92 66 C96 74 86 78 78 74 C70 82 60 80 56 72 Z"/>
<path d="M34 90 C42 86 52 88 54 96 L50 100 L30 100 Z"/>
</g>
<circle cx="50" cy="152" r="98" fill="none" stroke="#8fe0ff" stroke-width="3"/>
<circle cx="50" cy="152" r="101" fill="none" stroke="#4cf2ff" stroke-opacity="0.35" stroke-width="4"/>
</g>
</svg>
